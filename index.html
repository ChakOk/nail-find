<script>
/* Движок подбора маникюра. Работает и в браузере (window.NailEngine), и в Node.
   Без нейросети, без сети — только логика. */
(function (root) {
  'use strict';

  function tagMap(cfg) { // tagId -> categoryId
    const m = {};
    cfg.categories.forEach(c => c.tags.forEach(t => { m[t.id] = c.id; }));
    return m;
  }
  function photoTags(p) { return Object.values(p.tags); }

  function createState(now) {
    return { scores: {}, dislikes: {}, shown: {}, seen: [], won: {}, blacklist: [],
             swipes: 0, lastActive: now == null ? Date.now() : now };
  }
  function isExpired(st, cfg, now) {
    return (now || Date.now()) - st.lastActive > cfg.params.resetDays * 86400000;
  }
  const NONE = '__none__';
  const sc = (st, t) => st.scores[t] || 0;

  function eligible(st, photos) {
    const bl = new Set(st.blacklist);
    return photos.filter(p => !photoTags(p).some(t => bl.has(t)));
  }
  function availableTags(st, photos, cat) {
    const set = new Set();
    eligible(st, photos).forEach(p => { if (p.tags[cat.id]) set.add(p.tags[cat.id]); });
    return cat.tags.map(t => t.id).filter(t => set.has(t));
  }
  function ranking(st, photos, cat) {
    return availableTags(st, photos, cat).sort((a, b) =>
      (sc(st, b) - sc(st, a)) ||
      ((st.dislikes[a] || 0) - (st.dislikes[b] || 0)) ||
      ((st.shown[a] || 0) - (st.shown[b] || 0)));
  }

  // Проверка побед по категориям
  function settle(st, photos, cfg, force) {
    const { threshold, margin } = cfg.params;
    cfg.categories.forEach(cat => {
      if (st.won[cat.id]) return;
      const r = ranking(st, photos, cat);
      if (!r.length) { st.won[cat.id] = NONE; return; } // в категории не осталось тегов — пропускаем
      
      const lead = r[0], second = r[1];
      if (r.length === 1 || (sc(st, lead) >= threshold && sc(st, lead) - sc(st, second) >= margin) || force) {
        st.won[cat.id] = lead;
      }
    });
  }

  function openCats(st, cfg) { return cfg.categories.filter(c => !st.won[c.id]); }

  // Лидер категории, если она ещё не выиграна, иначе выигранный тег
  function leaderOf(st, photos, cat) { return st.won[cat.id] || ranking(st, photos, cat)[0]; }

  function nextCard(st, photos, cfg) {
    const pool = eligible(st, photos);
    const seen = new Set(st.seen);
    settle(st, photos, cfg);
    if (!openCats(st, cfg).length) return { type: 'done' };
    if (st.swipes >= cfg.params.maxSwipes) { settle(st, photos, cfg, true); return { type: 'done' }; }

    // Фаза 1: покрыть все теги хотя бы один раз
    const open = openCats(st, cfg);
    const covered = new Set();
    pool.forEach(p => { if (seen.has(p.id)) photoTags(p).forEach(t => covered.add(t)); });
    const wanted = new Set();
    open.forEach(c => availableTags(st, photos, c).forEach(t => { if (!covered.has(t)) wanted.add(t); }));
    if (wanted.size) {
      let best = null, bestN = 0;
      pool.forEach(p => {
        if (seen.has(p.id)) return;
        const n = open.reduce((a, c) => a + (wanted.has(p.tags[c.id]) ? 1 : 0), 0);
        if (n > bestN) { best = p; bestN = n; }
      });
      if (best) return { type: 'single', phase: 1, photo: best };
    }

    // Фаза 2: проверяем самую перспективную незавершённую категорию
    const cand = open
      .map(c => ({ c, r: ranking(st, photos, c) }))
      .filter(x => x.r.length)
      .sort((a, b) => sc(st, b.r[0]) - sc(st, a.r[0]));
    for (const { c, r } of cand) {
      const lead = r[0], second = r[1];
      const others = cfg.categories.filter(x => x.id !== c.id);
      const ctrl = (p) => others.reduce((a, o) => a + (p.tags[o.id] && p.tags[o.id] === leaderOf(st, photos, o) ? 1 : 0), 0);

      // Фаза 3: поединок, если порог достигнут, но отрыв мал
      if (sc(st, lead) >= cfg.params.threshold) {
        let bestPair = null, bestS = -1e9;
        const A = pool.filter(p => p.tags[c.id] === lead), B = pool.filter(p => p.tags[c.id] === second);
        A.forEach(a => B.forEach(b => {
          const same = others.reduce((n, o) => n + (a.tags[o.id] === b.tags[o.id] ? 1 : 0), 0);
          const s = same * 10 + ctrl(a) + ctrl(b) - (seen.has(a.id) ? 3 : 0) - (seen.has(b.id) ? 3 : 0);
          if (s > bestS) { bestS = s; bestPair = [a, b]; }
        }));
        if (bestPair) return { type: 'duel', phase: 3, cat: c.id, a: bestPair[0], b: bestPair[1] };
        st.won[c.id] = lead; // нечем сравнивать — берём лидера
        continue;
      }
      // одиночный тест лидера с контрольными тегами
      let best = null, bestS = -1;
      pool.forEach(p => {
        if (seen.has(p.id) || p.tags[c.id] !== lead) return;
        const s = ctrl(p);
        if (s > bestS) { best = p; bestS = s; }
      });
      if (best) return { type: 'single', phase: 2, cat: c.id, photo: best };
      st.won[c.id] = lead; // фото закончились — берём лидера
    }
    return nextCard(st, photos, cfg);
  }

  function answer(st, card, ans, photos, cfg, now) {
    const { likeWeight, dislikeWeight } = cfg.params;
    const tm = tagMap(cfg);
    const bump = (p, delta, dis) => photoTags(p).forEach(t => {
      if (st.won[tm[t]]) return; // выигранные категории заблокированы
      st.scores[t] = Math.max(0, sc(st, t) + delta);
      if (dis) st.dislikes[t] = (st.dislikes[t] || 0) + 1;
    });
    const mark = p => { st.seen.push(p.id); photoTags(p).forEach(t => { st.shown[t] = (st.shown[t] || 0) + 1; }); };
    if (card.type === 'single') {
      mark(card.photo);
      if (cfg.params.model === 'logistic') {
        // онлайн-логистическая регрессия: вес тега = вклад в вероятность лайка
        const ts = photoTags(card.photo), y = ans === 'like' ? 1 : 0;
        let z = st.bias || 0; ts.forEach(t => { z += sc(st, t); });
        const err = y - 1 / (1 + Math.exp(-z)), lr = cfg.params.lr || 0.6;
        ts.forEach(t => { st.scores[t] = sc(st, t) + lr * err; if (!y) st.dislikes[t] = (st.dislikes[t] || 0) + 1; });
        st.bias = (st.bias || 0) + 0.3 * lr * err;
      } else if (ans === 'like') bump(card.photo, likeWeight, false); else bump(card.photo, -dislikeWeight, true);
    } else if (card.type === 'duel') {
      const win = ans === 'a' ? card.a : card.b, lose = ans === 'a' ? card.b : card.a;
      [card.a, card.b].forEach(p => { if (!st.seen.includes(p.id)) mark(p); });
      const wt = win.tags[card.cat], lt = lose.tags[card.cat];
      const lg = cfg.params.model === 'logistic', st_ = lg ? (cfg.params.lr || 0.6) : likeWeight;
      st.scores[wt] = sc(st, wt) + st_;
      st.scores[lt] = lg ? sc(st, lt) - st_ : Math.max(0, sc(st, lt) - dislikeWeight);
      st.dislikes[lt] = (st.dislikes[lt] || 0) + 1;
    }
    st.swipes++; st.lastActive = now || Date.now();
    settle(st, photos, cfg);
  }

  function results(st, photos, cfg) {
    const wonCats = Object.keys(st.won);
    return eligible(st, photos).map(p => {
      let match = 0, miss = 0;
      wonCats.forEach(c => { if (p.tags[c] === st.won[c]) match++; else if (p.tags[c]) miss++; });
      return { photo: p, match, miss };
    }).sort((a, b) => (b.match - a.match) || (a.miss - b.miss))
      .slice(0, cfg.params.resultCount);
  }

  // Клиент отказался: отмечает теги, которые не понравились
  function reject(st, tagIds, cfg, now) {
    const tm = tagMap(cfg);
    tagIds.forEach(t => {
      if (!st.blacklist.includes(t)) st.blacklist.push(t);
      const cat = tm[t];
      delete st.won[cat];
      cfg.categories.find(c => c.id === cat).tags.forEach(x => { st.scores[x.id] = 0; });
    });
    st.lastActive = now || Date.now();
  }

  const api = { NONE, createState, nextCard, answer, results, reject, isExpired, settle };
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.NailEngine = api;
})(typeof window !== 'undefined' ? window : this);

</script>
<script>
(function () {
'use strict';
/* ================= НАСТРОЙКИ ================= */
const CONFIG = {"categories": [{"id": "shape", "name": "Форма", "tags": [{"id": "soft_square", "name": "Мягкий квадрат"}, {"id": "sharp_square", "name": "Чёткий квадрат"}, {"id": "squoval", "name": "Скво овал"}, {"id": "oval", "name": "Овал"}, {"id": "almond", "name": "Миндаль"}, {"id": "stiletto", "name": "Стилет"}, {"id": "ballerina", "name": "Баллерина"}]}, {"id": "color", "name": "Цвет", "tags": [{"id": "nude", "name": "Нюд"}, {"id": "glitter", "name": "Блестки"}, {"id": "bright", "name": "Яркий"}, {"id": "dark", "name": "Тёмный"}, {"id": "pastel", "name": "Пастельный"}]}, {"id": "design", "name": "Дизайн", "tags": [{"id": "french", "name": "Френч"}, {"id": "rubbing", "name": "Втирка"}, {"id": "cat_eye", "name": "Кошачий глаз"}, {"id": "minimal", "name": "Минимализм"}, {"id": "marble", "name": "Мрамор"}, {"id": "patal", "name": "Паталь"}, {"id": "handpaint", "name": "От руки"}, {"id": "gradient", "name": "Градиент"}, {"id": "drops", "name": "Капли"}]}], "params": {"threshold": 4, "margin": 2, "likeWeight": 1, "dislikeWeight": 1, "resultCount": 4, "maxSwipes": 60, "resetDays": 14}};
// Ссылка на опубликованную Google Таблицу (Файл → Поделиться → Опубликовать → CSV). Пока пусто — работает демо.
// Колонки: id | ссылка | <названия категорий: Форма, Цвет, Дизайн...> | статус (ок / на проверку)
const SHEET_CSV_URL = '';
// Адрес моста (Google Apps Script → Развернуть → Веб-приложение, ссылка вида https://script.google.com/macros/s/.../exec).
// Адрес не секретный: без подписи Telegram мост ничего не отдаёт. Пока пусто — работает демо без бота.
const API_URL = 'https://script.google.com/macros/s/AKfycbxuPO2anuZTwJ6hSqW2fDemiv2lsJm9AY7aAgRcQ0xZD1bib6crEGFcRxsQJrEeZ4NW/exec';
const DEMO_COUNT = 60;
const STORAGE_KEY = 'nail_state_v1';

const E = window.NailEngine; let cfg = CONFIG;
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }
const app = document.getElementById('app');
let photos = [], st = null, busy = false, selectedPhoto = null, isAdmin = false, lastTracked = '';

/* ================= УТИЛИТЫ ================= */
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const tagName = id => { for (const c of cfg.categories) for (const t of c.tags) if (t.id === id) return t.name; return id; };
function toast(msg) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = msg; document.body.appendChild(d); setTimeout(() => d.remove(), 4500); }
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ================= МОСТ (Google Apps Script) ================= */
async function api(action, payload) {
  const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, redirect: 'follow',
    body: JSON.stringify({ action, payload: payload || {}, initData: tg ? tg.initData : '' }) });
  return res.json();
}
async function A(action, payload) { const r = await api(action, payload); if (!r.ok) throw new Error(r.error || 'ошибка'); return r; }
function track(type, data) { if (API_URL) api('event', { type, data }).catch(() => {}); }

/* ================= ХРАНИЛИЩЕ СОСТОЯНИЯ ================= */
function loadState() {
  return new Promise(resolve => {
    const fromLocal = () => { try { const s = localStorage.getItem(STORAGE_KEY); resolve(s ? JSON.parse(s) : null); } catch (e) { resolve(null); } };
    if (tg && tg.CloudStorage) {
      try { tg.CloudStorage.getItem(STORAGE_KEY, (err, v) => { if (!err && v) { try { resolve(JSON.parse(v)); return; } catch (e) {} } fromLocal(); }); return; } catch (e) {}
    }
    fromLocal();
  });
}
function saveState() {
  const s = JSON.stringify(st);
  try { localStorage.setItem(STORAGE_KEY, s); } catch (e) {}
  if (tg && tg.CloudStorage && s.length < 4000) { try { tg.CloudStorage.setItem(STORAGE_KEY, s); } catch (e) {} }
}

/* ================= ДАННЫЕ: Google Таблица или демо ================= */
function parseCSV(text) {
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { row.push(cur); cur = ''; }
    else if (ch === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (ch !== '\r') cur += ch;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows;
}
async function loadFromSheet(url) {
  const res = await fetch(url); if (!res.ok) throw new Error('HTTP ' + res.status);
  const rows = parseCSV(await res.text()); const head = rows[0].map(h => h.trim().toLowerCase());
  const col = names => head.findIndex(h => names.includes(h));
  const iId = col(['id', 'ид']), iUrl = col(['ссылка', 'url', 'картинка']), iSt = col(['статус', 'status']);
  const catCols = cfg.categories.map(c => ({ c, i: head.indexOf(c.name.toLowerCase()) }));
  const out = [];
  rows.slice(1).forEach((r, n) => {
    const url = (r[iUrl] || '').trim(); if (!url) return;
    if (iSt >= 0) { const s = (r[iSt] || '').trim().toLowerCase(); if (!['ок', 'ok', 'да', 'yes'].includes(s)) return; }
    const tags = {};
    catCols.forEach(({ c, i }) => {
      if (i < 0) return; const v = (r[i] || '').trim().toLowerCase(); if (!v) return;
      const t = c.tags.find(t => t.name.toLowerCase() === v || t.id === v);
      if (t) tags[c.id] = t.id; else console.warn('Неизвестный тег:', v, 'в строке', n + 2);
    });
    if (Object.keys(tags).length) out.push({ id: iId >= 0 && r[iId] ? r[iId].trim() : 'r' + (n + 1), url, tags });
  });
  return out;
}

/* ===== демо-картинки (рисуем сами, пока нет реальной базы) ===== */
const PATHS = {
  soft_square: 'L210,150 Q210,120 180,120 L120,120 Q90,120 90,150 Z',
  sharp_square: 'L210,126 Q210,120 204,120 L96,120 Q90,120 90,126 Z',
  squoval: 'L210,170 Q210,120 160,120 L140,120 Q90,120 90,170 Z',
  oval: 'L210,200 Q210,100 150,100 Q90,100 90,200 Z',
  almond: 'L208,240 C200,140 175,80 150,50 C125,80 100,140 92,240 Z',
  stiletto: 'L205,260 C190,170 160,80 150,25 C140,80 110,170 95,260 Z',
  ballerina: 'L205,300 L180,70 Q178,60 168,60 L132,60 Q122,60 120,70 L95,300 Z'

const PAL = {

function nailSvg(p) {
  const r = mulberry(String(p.id).split('').reduce((a, c) => a * 31 + c.charCodeAt(0), 7));
  const shape = p.tags.shape || ['soft_square', 'oval', 'almond', 'ballerina'][Math.floor(r() * 4)];
  const colTag = p.tags.color || 'nude', pal = PAL[colTag] || PAL.nude, base = pal[Math.floor(r() * pal.length)];
  const design = p.tags.design, top = TOP[shape], path = 'M90,350 Q90,370 110,370 L190,370 Q210,370 210,350 ' + PATHS[shape];
  const hue = Math.floor(r() * 360);
  let d = '';
  if (colTag === 'glitter') for (let i = 0; i < 45; i++) d += `<circle cx="${90 + r() * 120}" cy="${top + r() * (370 - top)}" r="${1 + r() * 2.5}" fill="#fff" opacity="${.5 + r() * .5}"/>`;
  if (design === 'french') d += `<path d="M80,${top - 10} H220 V${top + 50} Q150,${top + 80} 80,${top + 50} Z" fill="#fff"/>`;
  if (design === 'rubbing') d += `<rect x="80" y="${top}" width="140" height="${370 - top}" fill="url(#rub)" opacity=".6"/>`;
  if (design === 'cat_eye') d += `<polygon points="115,${top + 30} 150,${top + 20} 120,360 100,360" fill="url(#cat)" opacity=".75"/>`;
  if (design === 'minimal') d += `<path d="M105,${top + 80} Q150,${top + 40} 195,${top + 90}" stroke="#222" stroke-width="2.5" fill="none"/><circle cx="170" cy="${top + 120}" r="4" fill="#222"/>`;
  if (design === 'marble') for (let i = 0; i < 6; i++) d += `<path d="M80,${top + r() * 250} q30,${-30 + r() * 60} 60,0 t70,${-20 + r() * 40}" stroke="${i % 2 ? '#fff' : '#777'}" stroke-width="${1 + r() * 2}" fill="none" opacity=".6"/>`;
  if (design === 'patal') for (let i = 0; i < 14; i++) { const x = 90 + r() * 110, y = top + r() * (360 - top); d += `<polygon points="${x},${y} ${x + 10},${y + 3} ${x + 6},${y + 12}" fill="#e6b84a" opacity=".9"/>`; }
  if (design === 'handpaint') d += `<path d="M105,${top + 90} q15,-40 30,0 t30,0 t30,0" stroke="#fff" stroke-width="3" fill="none"/><circle cx="150" cy="${top + 150}" r="8" fill="#ff5c8a"/><path d="M150,${top + 158} v30" stroke="#3a9d5d" stroke-width="3"/>`;
  if (design === 'gradient') d += `<rect x="80" y="${top}" width="140" height="${370 - top}" fill="url(#grad)"/>`;
  if (design === 'drops') for (let i = 0; i < 8; i++) { const x = 105 + r() * 90, y = top + 20 + r() * (320 - top), rr = 5 + r() * 8; d += `<circle cx="${x}" cy="${y}" r="${rr}" fill="#fff" opacity=".85"/><circle cx="${x - rr / 3}" cy="${y - rr / 3}" r="${rr / 4}" fill="#fff"/>`; }
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400"><defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${hue},60%,92%)"/><stop offset="1" stop-color="hsl(${(hue + 40) % 360},55%,82%)"/></linearGradient>
    <linearGradient id="rub" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9ee0"/><stop offset=".5" stop-color="#9ef0ff"/><stop offset="1" stop-color="#d6a8ff"/></linearGradient>
    <linearGradient id="cat" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="grad" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#ff8fb8"/></linearGradient>
    <clipPath id="n"><path d="${path}"/></clipPath></defs>
    <rect width="300" height="400" fill="url(#bg)"/>
    <rect x="68" y="${Math.max(top + 120, 250)}" width="164" height="200" rx="60" fill="#f1d3c1"/>
    <path d="${path}" fill="${base}"/><g clip-path="url(#n)">${d}</g>
    <path d="${path}" fill="none" stroke="rgba(0,0,0,.12)" stroke-width="2"/></svg>`;
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}
function makeDemo(n) {
  const r = mulberry(2026), seen = new Set(), out = [];
  while (out.length < n) {
    const tags = {}; cfg.categories.forEach(c => { tags[c.id] = c.tags[Math.floor(r() * c.tags.length)].id; });
    const k = Object.values(tags).join('|'); if (seen.has(k)) continue; seen.add(k);
    const p = { id: 'd' + (out.length + 1), tags }; p.url = nailSvg(p); out.push(p);
  }
  return out;
}

      '<p>Категории и теги меняются в листе «Категории» таблицы.</p><button class="btn" id="ssave">Сохранить</button>';
    document.getElementById('ssave').onclick = async () => {
      const params = {}; pane.querySelectorAll('input[data-k]').forEach(i => { params[i.dataset.k] = Number(i.value); });
      try { await A('admin_settings_set', { params }); toast('Сохранено. Клиенты получат новые настройки при следующем открытии.'); } catch (e) { toast(e.message); }
    };
  }
};

/* ================= ГЛАВНЫЙ ЦИКЛ ================= */
function step() {
  const card = E.nextCard(st, photos, cfg); saveState();
  if (card.type === 'single') screenSingle(card);
  else if (card.type === 'duel') screenDuel(card);
  else screenResult();
}
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') { const b = document.getElementById('yes'); if (b) b.click(); }
  if (e.key === 'ArrowLeft') { const b = document.getElementById('no'); if (b) b.click(); }
});
(async function init() {
  app.innerHTML = '<div class="center"><p>Загружаем маникюры…</p></div>';
  if (API_URL) {
    if (!(tg && tg.initData)) { app.innerHTML = '<div class="center"><div style="font-size:48px">📱</div><h2>Откройте приложение в Telegram</h2><p>Эта страница работает только внутри бота.</p></div>'; return; }
    try {
      const r = await A('catalog'); cfg = r.config; photos = r.photos; isAdmin = !!r.isAdmin;
      if (photos.length < 5 && !isAdmin) throw new Error('база фото пока пуста');
    } catch (e) {
      app.innerHTML = '<div class="center"><h2>Не удалось загрузить</h2><p>' + esc(e.message) + '</p><button class="btn" onclick="location.reload()">Повторить</button></div>'; return;
    }
  } else photos = await loadPhotos();
  st = await loadState();
  if (!st || E.isExpired(st, cfg)) st = E.createState(); // автосброс после resetDays без захода
  st.lastActive = Date.now(); saveState();
  track('session_start', { resumed: st.swipes > 0 });
  screenStart();
})();
})();
</script>
